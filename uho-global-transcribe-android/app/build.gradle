plugins {
    id 'com.android.application'
}

android {
    namespace 'com.obstino.uho_transcribe'
    compileSdk 36
    ndkVersion "29.0.14206865"

    // Load local.properties
    def localProperties = new Properties()
    def localPropertiesFile = rootProject.file('local.properties')
    if (localPropertiesFile.exists()) {
        localProperties.load(new FileInputStream(localPropertiesFile))
    }

    signingConfigs {
        release {
            storeFile file(localProperties['RELEASE_STORE_FILE'])
            storePassword localProperties['RELEASE_STORE_PASSWORD']
            keyAlias localProperties['RELEASE_KEY_ALIAS']
            keyPassword localProperties['RELEASE_KEY_PASSWORD']
        }
    }

    defaultConfig {
        applicationId 'com.obstino.uho_transcribe'
        minSdk 23 //27
        targetSdk 36
        versionCode 24  // version code 24 not yet on play store
        versionName "3.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            //abiFilters 'arm64-v8a'
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++14"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
    buildFeatures {
        viewBinding true
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
	
	assetPacks = [":my_ai_pack", ":assets_pt", ":assets_ar", ":assets_ca", ":assets_eo", ":assets_fa", ":assets_hr", ":assets_ko", ":assets_pl", ":assets_sl", ":assets_de", ":assets_fr", ":assets_it", ":assets_mr", ":assets_ru", ":assets_ua", ":assets_by", ":assets_en", ":assets_es_en", ":assets_hi", ":assets_ja_en", ":assets_nl", ":assets_rw", ":assets_zh_en"]
    //assetPacks = [":my_ai_pack", ":assets_en", ":assets_es_en"]
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'com.google.android.play:review:2.0.2'
    implementation "com.google.android.play:asset-delivery:2.3.0"
    implementation "androidx.work:work-runtime:2.11.2"
    implementation 'com.github.anrwatchdog:anrwatchdog:1.4.0'
    implementation 'com.google.guava:guava:33.6.0-android'

//    implementation 'androidx.activity:activity:1.9.3'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    implementation(platform("org.jetbrains.kotlin:kotlin-bom:1.8.0"))   // added this line because of duplicate dependency bug (https://gist.github.com/danielcshn/7aa57155d766d46c043fde015f054d40)
}